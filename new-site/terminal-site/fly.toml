# fly.toml app configuration file generated for computingclubwebsite on 2026-09-04T02:36:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'computingclubwebsite'
primary_region = 'yyz'

[env]
  PORT = '80'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']
  size = 'shared-cpu-1x'
